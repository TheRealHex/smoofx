# Default settings
hwdec=vaapi  # Uncomment if you want to use VAAPI for hardware decoding
gpu-api=opengl
# Network Buffering
demuxer-max-bytes=100M
deband=no
sws-allow-zimg=yes
sws-scaler=bilinear
sws-fast=yes
zimg-scaler=bilinear
zimg-dither=no
dither-depth=no
scale=bilinear
cscale=bilinear
dscale=bilinear
scale-antiring=0
cscale-antiring=0
correct-downscaling=no
sigmoid-upscaling=no

# YouTube-DL Format Options
[best]
# Best format excluding VP9
ytdl-format="bv+ba"

[1080p]
# ytdl-format=1080p[height<=?1080p][vcodec!=vp9.2]+bestaudio/best
ytdl-format="bv[height<=1080]+ba"

# 720p format option
[720p]
ytdl-format="bv[height<=720]+ba"

# 480p format option
[480p]
ytdl-format="bv[height<=480]+ba"
