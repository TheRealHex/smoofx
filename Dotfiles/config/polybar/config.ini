[bar/dock]
monitor = eDP1
width = 28.5%
height = 24
offset-x = 34%
offset-y = .8%
background = #0f0d0f
radius = 6
separator ="  " 
font-0 = CaskaydiaCove Nerd Font:style:Bold:pixelsize=9;2
; wm-restack = bspwm
; float=10
cursor-click = pointer
modules-center = temperature mem wlan pulseaudio battery0 battery1 date powermenu
bottom = true
enable-ipc = true
override-redirect = true

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
inline-mode = true
enable-click = true
enable-scroll = true
everse-scroll = false
format = <label-state>
ws-icon-0 = I; % {F#dd9761} 
ws-icon-1 = II; % {F#70ace0} 
ws-icon-2 = IV; % {F#fcdc9c} 
ws-icon-3 = III; % {F#dd6161} 
ws-icon-4 = V; % {F#a3be8c} 

label-focused = %icon%
label-focused-background = #1a1a1a
label-focused-padding-left = 3
label-focused-padding-right = 3
label-occupied = %icon%
label-occupied-padding = 1
label-urgent = %icon%
label-urgent-padding-left = 2
label-urgent-padding-right = 2
label-urgent-background = #ffffff
label-empty = %icon%
label-empty-padding = 1
label-separator = " "

[module/powermenu]
type = custom/text
label = " "
click-left = ~/.config/polybar/scripts/dmenu.sh &
label-foreground = #ad7fa8

[module/mem]
type = custom/script
exec = free -m | awk '/^Mem:/ {print $3}'
format =<label>
label = %output%
label-foreground = #70ace0

[module/wired-network]
type = internal/network
interface = eth0

[module/wlan]
type = internal/network
interface = wlan0
interval = 5.0
format-connected =<label-connected>
label-connected = " "
label-connected-foreground = #a1d15c
format-disconnected =<label-disconnected>
label-disconnected = ""

[module/date]
type = internal/date
interval = 60
time = "%I:%M"
date-alt ="%a %b %d"
label-foreground = #eee
label ="%time%%date%"

[module/battery0]
type = internal/battery
full-at = 99
low-at = 15

; Use the following command to list batteries and adapters:
; $ ls -1 /sys/class/power_supply/
battery = BAT0
adapter = ADP0
poll-interval = 5
; time-format = %H:%M
format-charging =<label-charging>
format-charging-foreground = #8ef29f
format-discharging =<ramp-capacity>  <label-discharging>
format-discharging-foreground = #ff8e88
format-low-foreground = #ff8e88
format-full =<ramp-capacity>
format-full-foreground = #dedede
format-low =<ramp-capacity>  <label-low> 
label-charging =" %percentage%%"
label-discharging = "%percentage%%"
ramp-capacity-0 =""
ramp-capacity-1 =""
ramp-capacity-2 =""
ramp-capacity-3 =""
ramp-capacity-4 =" " 
label-low ="%percentage%%


[module/battery1]
type = internal/battery
full-at = 99
low-at = 15

; Use the following command to list batteries and adapters:
; $ ls -1 /sys/class/power_supply/
battery = BAT1
adapter = ADP1

poll-interval = 5
time-format = %H:%M
format-charging =<label-charging>
format-charging-foreground = #8ef29f
format-discharging =<ramp-capacity>  <label-discharging>
format-discharging-foreground = #ff8e88
format-low-foreground = #ff8e88
format-full = <ramp-capacity>
format-full-foreground = #afafaf
format-low =<ramp-capacity> <label-low>
label-charging =" %percentage%%"
label-discharging = "%percentage%%"
ramp-capacity-0 =""
ramp-capacity-1 =""
ramp-capacity-2 =""
ramp-capacity-3 =""
ramp-capacity-4 =" " 
label-low = "%percentage%%"

[module/pulseaudio]
type = internal/pulseaudio
master-soundcard = default
speaker-soundcard = default
headphone-soundcard = default
mapped = true
format-volume = <label-volume>
label-volume = " %percentage%"
label-foreground = #fcdc9c
label-muted = "" 
; label-muted-foreground = #fcabcd

[module/temperature]
type = internal/temperature
thermal-zone = 0
warn-temperature = 60
label-foreground = #ddb061
format = <ramp> <label>
format-warn = <ramp> <label-warn>
format-warn-underline = #b48ead
label =%temperature-c%
label-warn = % temperature-c%
label-warn-foreground = #f2835e
ramp-0 = 
ramp-foreground = #ddb061

[settings]
screenchange-reload = false
; compositing-background = #f0d0f
; compositing-foreground = over
; compositing-overline = over
; compositing-underline = over
; compositing-border = over 
; pseudo-transparency = false

; [global/wm]
; margin-top = 2
; margin-bottom = 2
; ipc = false
